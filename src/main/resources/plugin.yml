name: FortniteToken
version: 1.2.0
main: de.cuteghg.fortnitetoken.FortniteTokenPlugin
api-version: '26.3'
author: cuteGHG
description: Gives a rare Token from naturally generated loot containers.
commands:
  fttoken:
    description: FortniteToken test and config commands
    usage: /fttoken test | /fttoken reload
    permission: fortnitetoken.test
permissions:
  fortnitetoken.test:
    description: Allows testing the FortniteToken reward and animation
    default: op
  fortnitetoken.admin:
    description: Allows reloading the FortniteToken configuration
    default: op
